<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Luxury Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Metallic Gold Glow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />
  
  <!-- Ambient Inner Glow Rim -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" opacity="0.3" />

  <!-- Center 3D Voice & AI Waves -->
  <g filter="url(#subtleShadow)">
    <!-- Dynamic AI Soundwaves / Translation Rings -->
    <path d="M156 256 C156 200, 200 156, 256 156 C312 156, 356 200, 356 256" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" opacity="0.8" />
    <path d="M120 256 C120 180, 180 120, 256 120 C332 120, 392 180, 392 256" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 12" />
    
    <!-- Central Modern YAP Diamond Monogram -->
    <g transform="translate(256, 256)">
      <!-- AI Core Diamond -->
      <polygon points="0,-72 68,0 0,72 -68,0" fill="url(#emeraldGrad)" opacity="0.15" />
      <polygon points="0,-72 68,0 0,72 -68,0" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" />
      
      <!-- Modern Stylized 'Y' & Voice Mic Emblem -->
      <!-- Left Wing of Y -->
      <path d="M-32 -36 L0 6 L0 44" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Wing of Y -->
      <path d="M32 -36 L0 6" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Center Gold Sparkle -->
      <circle cx="0" cy="6" r="6" fill="url(#goldGrad)" filter="url(#neonGlow)" />
      
      <!-- Top Sound Arc -->
      <path d="M-18 -54 Q0 -64 18 -54" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Bottom Audio Equalizer Dots / Language Dots -->
    <circle cx="216" cy="380" r="8" fill="url(#emeraldGrad)" />
    <circle cx="256" cy="380" r="10" fill="url(#cyanGrad)" />
    <circle cx="296" cy="380" r="8" fill="url(#goldGrad)" />
  </g>
</svg>
