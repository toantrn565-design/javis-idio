<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgObsidian" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="45%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Cyber Emerald Gradient -->
    <linearGradient id="cyberEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Pure Platinum Gradient -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Squircle Frame with Luxury Rim -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgObsidian)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="3.5" />
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#cyberEmerald)" stroke-width="1.5" opacity="0.4" />

  <!-- Outer Acoustic Resonance Waves (Voice & Translation Aura) -->
  <g filter="url(#softShadow)">
    <!-- Dynamic Orbiting Translation Arcs -->
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#cyberEmerald)" stroke-width="3" stroke-dasharray="14 18" opacity="0.3" />
    <path d="M120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#electricCyan)" stroke-width="10" stroke-linecap="round" opacity="0.75" />
    <path d="M392 256 A 136 136 0 0 1 150 348" fill="none" stroke="url(#cyberEmerald)" stroke-width="8" stroke-linecap="round" opacity="0.5" />

    <!-- 4 Equalizer Acoustic Bars (Voice Modulation) -->
    <line x1="88" y1="236" x2="88" y2="276" stroke="url(#electricCyan)" stroke-width="8" stroke-linecap="round" opacity="0.7" />
    <line x1="104" y1="216" x2="104" y2="296" stroke="url(#electricCyan)" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <line x1="408" y1="216" x2="408" y2="296" stroke="url(#cyberEmerald)" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <line x1="424" y1="236" x2="424" y2="276" stroke="url(#cyberEmerald)" stroke-width="8" stroke-linecap="round" opacity="0.7" />

    <!-- CENTRAL EMBLEM: JAVIS Idio (Interlocking 'J' & 'i' Monogram) -->
    <g transform="translate(256, 256)">
      <!-- Hexagonal / Diamond Shield Core -->
      <polygon points="0,-108 94,0 0,108 -94,0" fill="url(#cyberEmerald)" opacity="0.08" />
      <polygon points="0,-108 94,0 0,108 -94,0" fill="none" stroke="url(#cyberEmerald)" stroke-width="2.5" opacity="0.4" />

      <!-- Stylized 'J' (Left & Hook) -->
      <path d="M-18 -76 L-18 20 C-18 56, -46 64, -62 50" fill="none" stroke="url(#electricCyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Stylized 'I' / 'Idio' Core Pillar (Right) -->
      <path d="M28 -34 L28 62" fill="none" stroke="url(#platinumGrad)" stroke-width="20" stroke-linecap="round" />
      
      <!-- 'i' Dot: Glowing Imperial Gold AI Nucleus -->
      <circle cx="28" cy="-66" r="14" fill="url(#imperialGold)" filter="url(#coreGlow)" />
      <circle cx="28" cy="-66" r="6" fill="#ffffff" />

      <!-- Center Interlocking Synergy Spark (Connecting J & I) -->
      <path d="M-18 -10 Q5 -20 28 -10" fill="none" stroke="url(#cyberEmerald)" stroke-width="8" stroke-linecap="round" opacity="0.9" />

      <!-- Golden AI Sparkle Star (Top Apex) -->
      <path d="M0 -96 Q0 -82 10 -82 Q0 -82 0 -68 Q0 -82 -10 -82 Q0 -82 0 -96 Z" fill="url(#imperialGold)" filter="url(#coreGlow)" />
    </g>

    <!-- Bottom Triad Status Nodes (Speech • Translate • Meeting) -->
    <circle cx="216" cy="410" r="7" fill="url(#electricCyan)" />
    <circle cx="256" cy="410" r="9" fill="url(#imperialGold)" filter="url(#coreGlow)" />
    <circle cx="296" cy="410" r="7" fill="url(#cyberEmerald)" />
  </g>
</svg>
